[project]
name = "netmapper-backend"
version = "0.1.0"
description = "NetMapper network topology visualizer backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.23,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "scapy>=2.5,<3.0",
    "python-nmap>=0.7,<1.0",
    "apscheduler>=3.10,<4.0",
    "aiosqlite>=0.19,<1.0",
]

[tool.uv.pip]
python-version = "3.12"

[tool.setuptools]
packages = ["app"]
